[package]
name = "warraq-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Warraq core: warraq-pdf"

[dependencies]
thiserror.workspace = true
log.workspace = true
lopdf.workspace = true
# Standard security handler (src/crypt): RustCrypto only, all MIT/Apache-2.0,
# no OpenSSL. Pinned to the versions lopdf 0.45 already pulls in, so nothing
# new is added to the dependency graph. RC4 is written out in src/crypt.
aes = "0.9"
cbc = "0.2"
md-5 = "0.11"
sha2 = "0.11"
pdf-writer.workspace = true
subsetter.workspace = true
warraq-text = { path = "../warraq-text" }
