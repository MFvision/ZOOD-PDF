[package]
name = "warraq-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Warraq core: warraq-pdf"

[dependencies]
thiserror.workspace = true
log.workspace = true
lopdf.workspace = true
# Standard security handler (src/crypt): RustCrypto only, all MIT/Apache-2.0,
# no OpenSSL. Pinned to the versions lopdf 0.45 already pulls in, so nothing
# new is added to the dependency graph. RC4 is written out in src/crypt.
aes = "0.9"
cbc = "0.2"
md-5 = "0.11"
sha2 = "0.11"
# Fresh AES initialisation vectors when an update to an encrypted file is
# written (src/crypt). Already in the graph through lopdf; the browser build
# gets its `wasm_js` backend from warraq-core.
getrandom = "0.4"
# Compress (src/compress.rs): the best Flate level, and JPEG for downsampled
# images. Both already in the graph through hayro; `jpeg` only turns on the
# encoder next to the decoder hayro already has.
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
pdf-writer.workspace = true
subsetter.workspace = true
warraq-text = { path = "../warraq-text" }
