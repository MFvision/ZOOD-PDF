[package]
name = "warraq-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"
description = "cargo-fuzz targets for the ZOOD PDF engine parsers (never shipped)."

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lopdf = { version = "0.45", default-features = false }
warraq-pdf = { path = "../crates/warraq-pdf" }
warraq-sign = { path = "../crates/warraq-sign" }
warraq-text = { path = "../crates/warraq-text" }
warraq-office = { path = "../crates/warraq-office" }
warraq-edit = { path = "../crates/warraq-edit" }
serde_json = "1"

# Standalone: not a member of the engine workspace (see ../Cargo.toml `exclude`).
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "load"
path = "fuzz_targets/load.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decrypt"
path = "fuzz_targets/decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "rebase"
path = "fuzz_targets/rebase.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cms"
path = "fuzz_targets/cms.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content_text"
path = "fuzz_targets/content_text.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sig_dict"
path = "fuzz_targets/sig_dict.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cmap"
path = "fuzz_targets/cmap.rs"
test = false
doc = false
bench = false

# warraq-office (Export/Compare): ruling-line reader + table detection + export writers, and the
# ZIP reader.
[[bin]]
name = "ruling_tables"
path = "fuzz_targets/ruling_tables.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip_read"
path = "fuzz_targets/zip_read.rs"
test = false
doc = false
bench = false

# warraq-edit (Edit tool): byte-faithful content lexer/rewriter, link URL check with Punycode,
# JPEG/PNG picture decoding.
[[bin]]
name = "content_rewrite"
path = "fuzz_targets/content_rewrite.rs"
test = false
doc = false
bench = false

[[bin]]
name = "url_check"
path = "fuzz_targets/url_check.rs"
test = false
doc = false
bench = false

[[bin]]
name = "picture_decode"
path = "fuzz_targets/picture_decode.rs"
test = false
doc = false
bench = false
