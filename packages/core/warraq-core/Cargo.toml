[package]
name = "warraq-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Warraq core: warraq-core"

[dependencies]
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
warraq-text = { path = "../warraq-text" }
warraq-pdf = { path = "../warraq-pdf" }
warraq-render = { path = "../warraq-render" }
warraq-sign = { path = "../warraq-sign" }
# Search-and-redact's patterns (src/tools/patterns.rs): matching in linear
# time, so no pattern and no page can make it run away. MIT/Apache-2.0.
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf-cache", "perf-dfa"] }
# Export's page images (src/tools/export.rs, `export.image`): JPEG and WebP.
# Already in the graph through warraq-pdf, with the same features, so nothing
# new joins it. MIT/Apache-2.0.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# The Library's index (src/tools/library): a content hash that tells two files
# apart for certain, and the eight bytes of checksum that refuse a damaged
# index. Pinned to the version warraq-pdf's security handler already pulls in,
# so nothing new joins the dependency graph. MIT/Apache-2.0.
sha2 = "0.11"
# Compare (src/tools/compare.rs): words in canonical form before they are
# matched. Already in the graph through warraq-text. MIT/Apache-2.0.
unicode-normalization.workspace = true

[lib]
# staticlib: libwarraq_core.a for the iOS app (scripts/ios/build-core.sh).
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = []
pdfium = ["warraq-render/pdfium"]
# The C ABI (src/ffi.rs) behind the iOS app's XCFramework.
ffi = []

[target.'cfg(target_arch = "wasm32")'.dependencies]
# transitive dependency (via lopdf/rand); the browser backend must be selected explicitly
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
js-sys = "0.3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
# Tests edit a file the way another program would (already in the graph
# through warraq-pdf).
lopdf.workspace = true
# The hostile-input tests (tests/hostile.rs) build decompression bombs with
# these; both are already in the graph through warraq-pdf. MIT/Apache-2.0.
flate2 = "1"
weezl = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--all-features"]
