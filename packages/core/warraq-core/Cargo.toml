[package]
name = "warraq-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Warraq core: warraq-core"

[dependencies]
thiserror.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
warraq-text = { path = "../warraq-text" }
warraq-pdf = { path = "../warraq-pdf" }
warraq-render = { path = "../warraq-render" }

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
pdfium = ["warraq-render/pdfium"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
# transitive dependency (via lopdf/rand); the browser backend must be selected explicitly
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
js-sys = "0.3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--all-features"]
