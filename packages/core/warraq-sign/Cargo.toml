[package]
name = "warraq-sign"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Warraq core: PDF digital signatures (PAdES), pure Rust"

# RustCrypto only, all MIT OR Apache-2.0, no OpenSSL: the same code signs and
# verifies in the browser (wasm32) and on the desktop. The formats generation
# (der 0.7, x509-cert 0.2, cms 0.2, rsa 0.9, p256/p384 0.13) is the last one
# released as stable; warraq-pdf's security handler uses the next one (aes 0.9,
# sha2 0.11), so both sit side by side in the graph.
[dependencies]
thiserror.workspace = true
log.workspace = true
serde.workspace = true
lopdf.workspace = true
warraq-pdf = { path = "../warraq-pdf" }
der = { version = "0.7", features = ["alloc", "derive", "oid", "std"] }
spki = { version = "0.7", features = ["alloc"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["std", "hazmat"] }
cms = { version = "0.2.3", default-features = false, features = ["std"] }
x509-tsp = "0.1"
x509-ocsp = "0.2.1"
const-oid = { version = "0.9", features = ["db"] }
pkcs8 = { version = "0.10", features = ["alloc"] }
pkcs5 = { version = "0.7", features = ["pbes2", "3des", "sha1-insecure", "alloc"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "sha256", "pkcs8", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "sha384", "pkcs8", "std"] }
ecdsa = { version = "0.16", default-features = false, features = ["der", "verifying", "signing", "std", "alloc", "pkcs8"] }
signature = "2.2"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
digest = "0.10"
hmac = "0.12"
des = "0.8"
rc2 = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
aes = "0.8"
cipher = { version = "0.4", features = ["alloc", "block-padding"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# Mozilla's root store (CDLA-Permissive-2.0 data, MPL-2.0 origin): the trust
# anchors a signature chain is checked against, beside the person's own.
webpki-roots = "1"

# rand_core 0.6 draws from getrandom 0.2, which needs its browser backend
# chosen explicitly on wasm32 (warraq-core does the same for 0.4).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
