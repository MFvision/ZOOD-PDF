[workspace]
resolver = "2"
members = [
  "crates/warraq-pdf",
  "crates/warraq-text",
  "crates/warraq-render",
  "crates/warraq-sign",
  "crates/warraq-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/MFvision/ZOOD-PDF"
rust-version = "1.85"

[workspace.dependencies]
lopdf = { version = "0.45", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1

# Xcode's linker cannot read Rust thin-LTO bitcode: LTO off for iOS.
[profile.ios]
inherits = "release"
lto = false
