[package]
name = "warraq-core"
description = "JSON + blobs RPC facade of the ZOOD PDF engine (wasm-bindgen, C ABI, Rust)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
warraq-pdf = { path = "../warraq-pdf" }
# Standards tool: PDF/A + PDF/X-4 validator, converter, preflight.
warraq-standards = { path = "../warraq-standards" }
warraq-sign = { path = "../warraq-sign" }
der = { version = "0.7", default-features = false }
zeroize = "1"
warraq-text = { path = "../warraq-text" }
# Create PDF (layout engine + readers); bundles the Amiri/Cairo/Inter fonts.
warraq-create = { path = "../warraq-create" }
# Export (DOCX/XLSX/PPTX/HTML/Markdown/text) and Compare.
warraq-office = { path = "../warraq-office" }
# Organize / Compress: content geometry (text boxes via warraq-text's interpreter), picture
# pages and image recompression. All MIT/Apache-2.0 (zune-*: MIT OR Apache-2.0 OR Zlib).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
png = "0.18"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
zune-core = { version = "0.5", default-features = false, features = ["std"] }
jpeg-encoder = { version = "0.7", default-features = false, features = ["std"] }
warraq-render = { path = "../warraq-render", optional = true, default-features = false, features = ["hayro"] }
wasm-bindgen = { version = "0.2", optional = true, default-features = false, features = ["std"] }
js-sys = { version = "0.3", optional = true, default-features = false, features = ["std"] }

[dev-dependencies]
# Compress output is compared with the original by rasterising both (tests only).
warraq-render = { path = "../warraq-render", default-features = false, features = ["hayro"] }

[features]
default = ["ffi"]
# C ABI for the iOS app (see include/warraq.h).
ffi = []
# wasm-bindgen class for the web UI. Build with `bash scripts/build-wasm.sh`.
wasm = ["dep:wasm-bindgen", "dep:js-sys", "warraq-pdf/wasm_js"]
# `pages.render` via hayro (adds several MB of wasm; off by default).
render = ["dep:warraq-render"]

# wasm-pack would download binaryen from GitHub at build time; scripts/build-wasm.sh runs
# wasm-opt itself when it is installed (WASM_OPT or PATH) so offline builds still work.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lints]
workspace = true
