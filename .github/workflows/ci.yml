name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v5

      - name: Linux WebKitGTK / GTK deps (Tauri) + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf xvfb xauth

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/core -> target
            packages/core -> ../../.target-wasm
            apps/desktop/src-tauri -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Swift toolchain (iOS engine bridge tests on Linux)
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: verify.sh
        run: bash scripts/verify.sh



      - name: Package web + extension zips
        run: |
          bash scripts/package-web.sh
          bash scripts/package-extension.sh

      - uses: actions/upload-artifact@v4
        with:
          name: zood-pdf-web-and-extension
          path: |
            out/zood-pdf-web.zip
            out/zood-pdf-extension.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
