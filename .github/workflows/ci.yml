# Warraq CI. See docs/ci.md for what each job gates and how to make the
# checks required on `main` (branch protection).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml reuses this workflow so a tag ships exactly what CI verified.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'

jobs:
  # (a) The Rust core: format, lint, test natively, and prove the same crate
  #     compiles for wasm32 ("one core, two builds").
  rust:
    name: rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy (native, warnings are errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test (native)
        run: cargo test
      - name: cargo check for wasm32 (one core, two builds)
        run: cargo check --target wasm32-unknown-unknown -p warraq-core

  # (b) The JS side: WASM core, lint and tests of every package, the web host
  #     and the browser extension (zip + Chrome --pack-extension validation).
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Build the WASM core
        run: pnpm build:core
      - name: Lint every package
        run: pnpm -r lint
      - name: Test every package
        run: pnpm -r test
      # vitest does not typecheck and eslint does not either; `build` in the
      # shared UI package is `tsc --noEmit`, and nothing was running it.
      - name: Typecheck the shared packages
        run: pnpm -r --filter './packages/**' build
      - name: Build the web host
        run: pnpm --filter @warraq/web build
      # Built before the click-through, which loads it into Chrome.
      - name: Build the extension (dist + zip)
        run: pnpm --filter @warraq/extension build
      # The interface, clicked through in the Google Chrome the runner already
      # has — the web build, and the extension loaded through DevTools.
      # Everything the first desktop build shipped broken passed the unit
      # tests; a tool is not done until a spec in apps/web/e2e proves it.
      - name: End-to-end click-through
        run: pnpm --filter @warraq/web e2e
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Validate the extension (manifest keys + Chrome --pack-extension)
        run: pnpm --filter @warraq/extension check
      - uses: actions/upload-artifact@v4
        with:
          name: warraq-extension
          path: apps/extension/dist/warraq-extension.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: warraq-web
          path: apps/web/dist
          if-no-files-found: error

  # (c) The Arabic corpus gate: every corpus PDF must open and render in
  #     PDFium (Chrome's engine, our reference). A failure blocks the merge.
  corpus:
    name: corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: .github/scripts/corpus-requirements.txt
      - name: Install pypdfium2, pikepdf, fonttools
        run: pip install -r .github/scripts/corpus-requirements.txt
      - name: Run the acid test with PDFium
        run: python3 tests/acid/run_python.py . pdfium
      - name: Merge and score
        run: python3 tests/acid/merge.py .
      - name: Gate — fail if any corpus file did not open in PDFium
        run: python3 .github/scripts/check_corpus.py .
      # Our own engine must not regress on Arabic extraction (ADR-0002).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core
      # Every PDF is hostile input: mutated corpus files must not panic or hang.
      # Golden renders: every corpus page must keep looking the same.
      - name: Golden renders
        run: cargo test --release --manifest-path packages/core/Cargo.toml -p warraq-core --test golden
      - name: Robustness (mutation harness on stable)
        run: cargo test --release --manifest-path packages/core/Cargo.toml -p warraq-core --test robustness
      - name: Run the acid test with the Warraq core
        run: cargo run --release --manifest-path packages/core/Cargo.toml -p warraq-core --example acid -- .
      - name: Gate — fail if Arabic extraction regressed
        run: python3 tests/acid/gate_warraq.py .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acid-results
          path: |
            tests/acid/results.json
            tests/acid/results-pdfium.json
            tests/acid/results-warraq.json
            docs/research/raw/acid-scores.md
          if-no-files-found: error

  # (d) Desktop bundles (unsigned) on macOS and Windows.
  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/core
            apps/desktop/src-tauri
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # Tauri prerequisites: macOS runners ship Xcode/CLT and Windows runners
      # ship MSVC + WebView2, so only Linux needs system packages (kept here
      # for the day ubuntu joins the matrix).
      - name: Tauri prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Build the WASM core (needed by the web UI)
        run: pnpm build:core
      - name: cargo fmt (desktop crate)
        run: cargo fmt --check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: clippy (desktop crate)
        run: cargo clippy --all-targets --manifest-path apps/desktop/src-tauri/Cargo.toml -- -D warnings
      # These cover the host contract: the permissions the UI invokes, the
      # custom-protocol feature a bundled build needs, and the native core.
      # `tauri build` below produces the frontend it embeds.
      - name: cargo test (desktop crate)
        # Dev profile on purpose: the release profile aborts on panic.
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: tauri build (unsigned)
        run: pnpm --filter @warraq/desktop build
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        with:
          name: warraq-desktop-${{ matrix.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
