name: macOS app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: ZOOD PDF.app (unsigned, Apple silicon)
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/core -> ../../.target-wasm
            apps/desktop/src-tauri -> target

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the engine (WASM)
        run: bash scripts/build-wasm.sh

      - name: OCR language models (pinned checksums)
        shell: bash
        run: bash scripts/fetch-ocr-models.sh

      - name: Desktop unit tests (incl. PDFKit print module compile)
        working-directory: apps/desktop/src-tauri
        run: cargo test

      - name: Build the .app
        working-directory: apps/desktop
        run: pnpm tauri build --bundles app

      - name: Verify bundle names
        run: |
          APP="apps/desktop/src-tauri/target/release/bundle/macos/ZOOD PDF.app"
          for key in CFBundleName CFBundleDisplayName; do
            v="$(/usr/libexec/PlistBuddy -c "Print :$key" "$APP/Contents/Info.plist")"
            echo "$key=$v"
            test "$v" = "ZOOD PDF"
          done
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" = "sa.zood.pdf"

      - name: Zip the .app (ditto keeps the bundle intact)
        run: |
          mkdir -p out
          ditto -c -k --keepParent "apps/desktop/src-tauri/target/release/bundle/macos/ZOOD PDF.app" "out/ZOOD PDF.app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: zood-pdf-macos-app
          path: out/ZOOD PDF.app.zip
          if-no-files-found: error
