# Hands the App Store screenshots of one "App Store screenshots" run to a
# DRAFT release (store-shots), so they can be fetched where Actions artifact
# storage is out of reach. Drafts are private to the repository's owners and
# never become the latest release.
name: Store shots relay

on:
  push:
    branches:
      - 'claude/**'
    paths:
      - '.github/workflows/store-shots-relay.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  relay:
    runs-on: ubuntu-latest
    env:
      RUN_ID: '41896392571'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: store-screenshots
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
          path: shots
      - name: Draft release with the pictures
        run: |
          cd shots && zip -qr ../store-shots.zip . && cd ..
          ls -la store-shots.zip
          gh release delete store-shots -R "$GITHUB_REPOSITORY" -y 2>/dev/null || true
          gh release create store-shots -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "App Store screenshots (draft, not a release)" --notes "Raw pictures from run $RUN_ID." store-shots.zip
