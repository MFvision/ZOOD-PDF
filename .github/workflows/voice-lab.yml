# Voice lab: open-source voices for read aloud on Windows, tried on GitHub's
# machines. Each engine reads the same sentences (scripts/voice-lab/texts.py)
# on the CPU; the samples (mp3) and the timings (results.jsonl) go to the
# `voice-lab-results` branch, so they can be heard and compared with nothing
# but git. Research only: nothing here ships in the app.
name: voice lab

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/voice-lab/**'
      - '.github/workflows/voice-lab.yml'

permissions:
  contents: write

jobs:
  engine:
    strategy:
      fail-fast: false
      matrix:
        include:
          # SILMA (silma-tts==1.0.5) and Habibi MSA (habibi-tts==0.1.1) were
          # tried here on 2026-10-20 (run 39481080681): 8 to 17 seconds of CPU
          # per second of speech, far from usable on a PC, so they are out.
          - { engine: piper, os: windows-latest, install: 'piper-tts==1.8.0' }
          - { engine: kokoro, os: ubuntu-latest, install: 'kokoro-onnx==0.4.9 soundfile' }
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.engine }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: ffmpeg
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then choco install ffmpeg -y --no-progress >/dev/null; else sudo apt-get update -q && sudo apt-get install -y -q ffmpeg >/dev/null; fi
      - name: install
        shell: bash
        run: |
          if [ "${{ matrix.engine }}" = silma ] || [ "${{ matrix.engine }}" = habibi ]; then
            # One matched set: torchcodec only loads against the torch it was built for.
            pip install --index-url https://download.pytorch.org/whl/cpu torch==2.8.0 torchaudio==2.8.0 torchvision==0.23.0
            pip install ${{ matrix.install }} torch==2.8.0 torchaudio==2.8.0 torchvision==0.23.0 torchcodec==0.7.0 2>&1 | tail -n 20
          else
            pip install ${{ matrix.install }} 2>&1 | tail -n 20
          fi
          pip show ${{ matrix.install }} 2>/dev/null | grep -E '^(Name|Version|License)' || true
      - name: run
        shell: bash
        env:
          LAB_OUT: ${{ github.workspace }}/lab-out/${{ matrix.engine }}-${{ runner.os }}
          PYTHONIOENCODING: utf-8
        working-directory: scripts/voice-lab
        run: |
          set -o pipefail
          mkdir -p "$LAB_OUT"
          python ${{ matrix.engine }}_lab.py 2>&1 | tee "$LAB_OUT/log.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-${{ matrix.engine }}-${{ runner.os }}
          path: lab-out

  # How well each sample can be understood: Whisper (large-v3, run by
  # faster-whisper) writes down what it hears, and the character error rate
  # against the sentence that was read says how much of it came through.
  results:
    needs: engine
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: understandability
        continue-on-error: true
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg >/dev/null
          pip install -q faster-whisper==1.1.1 jiwer==3.1.0 requests
          python scripts/voice-lab/understand.py artifacts 2>&1 | tee artifacts/understand.txt
      - name: push the samples
        shell: bash
        run: |
          mkdir out && cd out
          git init -q && git checkout -q -b voice-lab-results
          for dir in ../artifacts/*/; do cp -r "$dir"/* . 2>/dev/null || true; done
          cat */results.jsonl > results.jsonl 2>/dev/null || true
          cp ../artifacts/understand.txt ../artifacts/scores.jsonl . 2>/dev/null || true
          echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > status.txt
          echo "commit: $GITHUB_SHA" >> status.txt
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Voice lab results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" voice-lab-results
