# Builds the Windows desktop app. It cannot be built on a Mac — the Windows
# SDK, its linker and WebView2 exist only on Windows — so this runs on a
# Windows machine in CI and leaves the installer as an artifact.
#
# Run it: Actions → "desktop (Windows)" → Run workflow. On a v* tag it runs
# on its own. The installer is NSIS (.exe): WiX's MSI cannot write the app's
# Arabic name, ZOOD PDF (see apps/desktop/src-tauri/tauri.windows.conf.json).
#
# The app renders with its own Rust renderer here: PDFium's Windows library is
# not bundled, and the host falls back to it (apps/desktop/README.md).
name: desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # Pushing to this branch builds the installer and nothing else: the
    # "Run workflow" button only exists for workflows on the default branch,
    # and the general CI (which also builds on macOS) runs on main.
    branches: ['windows-build']

# contents: write — the installer is published as a release, and the run's
# outcome and the ends of its logs go to the `ci-logs` branch, so the build can
# be followed with nothing but git.
permissions:
  contents: write

jobs:
  windows:
    name: windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            packages/core

      - run: pnpm install --frozen-lockfile

      # `tauri build` runs the web build first (beforeBuildCommand) and then
      # bundles the installer.
      - name: build the installer
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir apps/desktop exec tauri build 2>&1 | tee build.log
        env:
          CI: 'true'
          # The cloud drives' public app IDs (docs/cloud.md); OneDrive falls back to ZOOD's own app.
          WARRAQ_ONEDRIVE_CLIENT_ID: ${{ vars.WARRAQ_ONEDRIVE_CLIENT_ID || '4c561684-3bf8-48e7-b4dc-ca1d7c8f9472' }}
          WARRAQ_ONEDRIVE_TENANT: ${{ vars.WARRAQ_ONEDRIVE_TENANT }}
          WARRAQ_GOOGLE_CLIENT_ID: ${{ vars.WARRAQ_GOOGLE_CLIENT_ID }}

      - name: what was built
        shell: bash
        run: ls -R apps/desktop/src-tauri/target/release/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: warraq-windows-installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/*.exe
          if-no-files-found: error

      # One page to download from. The file gets a plain name: the bundle's
      # own is the app's Arabic name, which some download tools mangle.
      - name: publish the installer as a release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="windows-$(date -u +%Y%m%d-%H%M)"
          exe="$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*.exe | head -n 1)"
          cp "$exe" ZOOD-PDF-Setup.exe
          # A test build: a pre-release, so "Latest" stays the real release.
          gh release create "$tag" ZOOD-PDF-Setup.exe --target "$GITHUB_SHA" --prerelease \
            --title "Windows installer ($tag)" \
            --notes "Built from $GITHUB_SHA on $(date -u +%Y-%m-%dT%H:%MZ). Unsigned: Windows will ask before running it."
          echo "$tag" > release-tag.txt

      # The ring, tried as a person would: a drop on a tool, a drop in the
      # middle then a click, and a drag near the screen's corner. Its log and
      # screenshots go to ci-logs.
      - name: try the ring
        id: ring
        continue-on-error: true
        shell: pwsh
        run: ./scripts/ci/ring-check.ps1 -App apps/desktop/src-tauri/target/release/warraq-desktop.exe -Sample tests/fixtures/layers/layers.pdf -Out ring-check

      # After the installer is out, so a failing test never withholds it: the
      # core's own tests on Windows — among them the installed-font lookup
      # against this machine's real fonts — and the desktop host's.
      - name: test the core on Windows
        shell: bash
        run: |
          set -o pipefail
          cargo test --release --manifest-path packages/core/Cargo.toml -p warraq-text -p warraq-pdf -p warraq-core 2>&1 | tee test-core.log

      - name: test the desktop host on Windows
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib 2>&1 | tee test-desktop.log

      # The phone remote on Windows: the phone page this build serves, in
      # Chrome at phone size, pairs with the remote's server, presents and
      # turns pages, and is refused with a used or wrong code; then a paired
      # phone's trackpad moves this machine's real pointer.
      - name: try the phone remote
        id: remote
        continue-on-error: true
        shell: bash
        env:
          CHROMIUM: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
        run: |
          set -o pipefail
          cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib remote -- --include-ignored --nocapture --test-threads=1 2>&1 | tee test-remote.log

      - name: record the outcome
        if: always()
        shell: bash
        run: |
          mkdir ci-out && cd ci-out
          git init -q && git checkout -q -b ci-logs
          {
            echo "status: ${{ job.status }}"
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "release: $(cat ../release-tag.txt 2>/dev/null || echo none)"
            echo "ring check: ${{ steps.ring.outcome }}"
            echo "remote check: ${{ steps.remote.outcome }}"
            echo "finished: $(date -u +%Y-%m-%dT%H:%MZ)"
          } > status.txt
          [ -d ../ring-check ] && cp -r ../ring-check ring-check
          for f in build test-core test-desktop test-remote; do
            [ -f "../$f.log" ] && tail -n 250 "../$f.log" > "$f.log"
          done
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -qm "Windows build: ${{ job.status }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs
