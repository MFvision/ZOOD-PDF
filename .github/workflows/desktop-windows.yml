# Builds the Windows desktop app. It cannot be built on a Mac — the Windows
# SDK, its linker and WebView2 exist only on Windows — so this runs on a
# Windows machine in CI and leaves the installer as an artifact.
#
# Run it: Actions → "desktop (Windows)" → Run workflow. On a v* tag it runs
# on its own. The installer is NSIS (.exe): WiX's MSI cannot write the app's
# Arabic name, محرر PDF (see apps/desktop/src-tauri/tauri.windows.conf.json).
#
# The app renders with its own Rust renderer here: PDFium's Windows library is
# not bundled, and the host falls back to it (apps/desktop/README.md).
name: desktop (Windows)

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # Pushing to this branch builds the installer and nothing else: the
    # "Run workflow" button only exists for workflows on the default branch,
    # and the general CI (which also builds on macOS) runs on main.
    branches: ['windows-build']

permissions:
  contents: read

jobs:
  windows:
    name: windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop/src-tauri
            packages/core

      - run: pnpm install --frozen-lockfile

      # `tauri build` runs the web build first (beforeBuildCommand) and then
      # bundles the installer.
      - run: pnpm --dir apps/desktop exec tauri build
        env:
          CI: 'true'

      - name: what was built
        shell: bash
        run: ls -R apps/desktop/src-tauri/target/release/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: warraq-windows-installer
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/*.exe
          if-no-files-found: error
