# Compiles the iPhone/iPad app (and its tests) for the simulator on GitHub's
# Mac, so a change to apps/ios made without a Mac at hand is known to build
# before it reaches the owner's Mac for TestFlight. Nothing is signed,
# installed or published; scripts/ios/build.sh on the Mac stays the real
# test run.
name: iOS compile

on:
  pull_request:
    paths:
      - 'apps/ios/**'
      - 'packages/core/warraq-core/include/**'
      - '.github/workflows/ios-compile.yml'
      - 'scripts/ios/**'
  workflow_dispatch:

concurrency:
  group: ios-compile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: iOS app compiles
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Newest Xcode on the runner
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $xcode"
          sudo xcode-select -s "$xcode"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/core -> ../../apps/ios/.build/cargo
      - name: Core for the simulator (debug)
        env:
          WARRAQ_IOS_SIM_ONLY: '1'
          WARRAQ_IOS_DEBUG: '1'
        run: zsh scripts/ios/build-core.sh
      - name: llama.cpp for the on-device model
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ios/fetch-llama.sh
          bin=$(find apps/ios/Vendor/llama.xcframework -path '*ios-arm64*simulator*' -name llama -type f | head -1)
          file "$bin" || true
      - name: Project
        run: |
          brew install xcodegen
          cd apps/ios && xcodegen generate --quiet
      - name: Build the app and its tests
        run: |
          status=0
          xcodebuild -project apps/ios/PDFEditor.xcodeproj -scheme PDFEditor \
            -destination 'generic/platform=iOS Simulator' ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO build-for-testing > build.log 2>&1 || status=$?
          grep -E 'error:|BUILD (SUCCEEDED|FAILED)' build.log | sort -u | head -200 || true
          exit $status
      - name: Unit tests on a simulator
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          echo "simulator $device"
          status=0
          xcodebuild -project apps/ios/PDFEditor.xcodeproj -scheme PDFEditor \
            -destination "id=$device" CODE_SIGNING_ALLOWED=NO \
            -only-testing:PDFEditorTests test-without-building > test.log 2>&1 || status=$?
          grep -E "Test Case .*failed|error:|Executed [0-9]+ test|\*\* TEST" test.log | sort -u | head -150 || true
          exit $status
      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: |
            build.log
            test.log
          if-no-files-found: ignore
