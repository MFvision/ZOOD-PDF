[package]
name = "zood-speech"
version = "0.1.0"
description = "ZOOD PDF read aloud: the operating system's own speech engine (AVSpeechSynthesizer on macOS, Windows.Media.SpeechSynthesis on Windows)"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/MFvision/ZOOD-PDF"
rust-version = "1.85"
publish = false

# Platform-independent logic (voice ranking, language matching, request checks) builds and is
# tested everywhere; the native engines are compiled only on their OS. Linux CI type-checks them
# with `cargo check --target aarch64-apple-darwin` / `x86_64-pc-windows-msvc` (no SDK needed).

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSObject", "NSString"] }
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "AVSpeechSynthesis"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "std",
  "Foundation",
  "Foundation_Collections",
  "Media_Core",
  "Media_Playback",
  "Media_SpeechSynthesis",
  "Storage_Streams",
] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
