[package]
name = "warraq-desktop"
version = "0.1.0"
description = "Warraq desktop shell: a thin Tauri 2 host around the shared web UI and the native warraq-core"
authors = ["Warraq contributors"]
edition = "2021"
license = "Apache-2.0"
publish = false

# This crate is its own cargo root (the repo root has no Cargo.toml); the core
# workspace in packages/core is consumed through the path dependency below.
[workspace]

[lib]
name = "warraq_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One core, two builds: the same crate that wasm-pack compiles for the web and
# the extension is linked natively here (rlib).
warraq-core = { path = "../../../packages/core/warraq-core" }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true
