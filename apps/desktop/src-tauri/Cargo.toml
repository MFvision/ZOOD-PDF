[package]
name = "warraq-desktop"
version = "0.1.0"
description = "Warraq desktop shell: a thin Tauri 2 host around the shared web UI and the native warraq-core"
authors = ["Warraq contributors"]
edition = "2021"
license = "Apache-2.0"
publish = false

# This crate is its own cargo root (the repo root has no Cargo.toml); the core
# workspace in packages/core is consumed through the path dependency below.
[workspace]

[lib]
name = "warraq_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# `src/main.rs` is a five-line shim around `run()`. Building a test harness for
# it makes rustc pick between the hashed and unhashed rlibs a `staticlib` +
# `rlib` library leaves side by side, which fails with E0460 — and there is
# nothing in the shim to test anyway.
[[bin]]
name = "warraq-desktop"
path = "src/main.rs"
test = false

[features]
# Required for any build that is not `tauri dev`. `tauri` reads this feature to
# decide between the dev server and the assets compiled into the binary: with it
# off, a bundled app opens an empty window pointed at `build.devUrl`, which is
# not running. `tauri build` turns it on; a bare `cargo build` does not, so a
# binary built that way is only ever good for `tauri dev`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the ring's transparent window on a Mac (src/ring.rs);
# tray-icon: the icon that stays while the quick tools are kept ready.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# One window for the app: a second launch (another PDF double-clicked in
# Explorer) hands its file to the window already open and exits (src/lib.rs,
# `second_launch`). MIT OR Apache-2.0.
tauri-plugin-single-instance = "2"
# The ring's keyboard shortcut, Ctrl+Alt+Z (Command+Option+Z), from any app
# (src/ring.rs, `shortcut`). MIT OR Apache-2.0.
tauri-plugin-global-shortcut = "2.3"
# Updates from GitHub (src/updates.rs): the app asks the stable channel's
# latest.json whether there is a newer version, and installs it only when its
# signature matches the public key in tauri.conf.json. MIT OR Apache-2.0.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# One core, two builds: the same crate that wasm-pack compiles for the web and
# the extension is linked natively here (rlib). `pdfium` makes the native
# rasterizer PDFium (ADR-0003/ADR-0006: desktop uses PDFium, browsers stay on
# the pure-Rust hayro backend).
warraq-core = { path = "../../../packages/core/warraq-core", features = ["pdfium"] }
# Direct (same-feature) dependency used only to probe, at runtime, whether the
# PDFium dynamic library could actually be bound — `warraq_core::Metadata.engine`
# is a compile-time `cfg!`, so it cannot see the fallback to hayro.
warraq-render = { path = "../../../packages/core/warraq-render", features = ["pdfium"] }
# `Direction` (rtl/ltr) for the text-line DTOs.
warraq-text = { path = "../../../packages/core/warraq-text" }
# Digital signatures (src/signing.rs): the signer trait a smart card
# implements, smart cards themselves over PKCS#11 (cryptoki, Apache-2.0),
# and the app's one HTTP client, used only on the person's click for a
# timestamp authority or a certificate status responder (ureq, MIT OR
# Apache-2.0; rustls with ring and Mozilla's roots).
warraq-sign = { path = "../../../packages/core/warraq-sign" }
cryptoki = "0.12"
ureq = { version = "3", default-features = false, features = ["rustls"] }
# The on-device model (src/ai.rs): llama.cpp through its Rust binding
# (llama-cpp-2, MIT OR Apache-2.0; llama.cpp and ggml themselves MIT), built
# from source by cmake. No OpenMP: ggml's own thread pool does the work, and
# Apple's clang ships without libomp. Metal on the Mac is below.
#
# Ask ZOOD (src/ask.rs) gives the same engine pictures and speech: llama.cpp's
# own multimodal library (mtmd, MIT), part of the same build.
llama-cpp-2 = { version = "0.1.157", default-features = false, features = ["mtmd"] }
# The downloaded model's checksum (sha2, MIT OR Apache-2.0; already in the
# core's graph) and its size shown in the interface.
sha2 = "0.10"
hex = "0.4"
# The model's tokens decoded to text as they come (encoding_rs, Apache-2.0 OR
# MIT, already in the graph through llama-cpp-2), and the machine's memory
# size (libc on macOS and Linux; windows-sys, MIT OR Apache-2.0, on Windows).
encoding_rs = "0.8"
# The day a file was last changed, on the computer's own calendar, for Ask
# ZOOD's tidy by month or date (src/ask/tidy.rs). chrono, MIT OR Apache-2.0,
# already in the graph.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The phone remote (src/remote/): a small server on the local network only
# while the person has it on, one WebSocket per phone (tokio-tungstenite, MIT),
# every message sealed with ChaCha20-Poly1305 under the key the QR code
# carries (chacha20poly1305, Apache-2.0 OR MIT), that QR code drawn as SVG
# (qrcode, MIT OR Apache-2.0), the PC's addresses on the network (if-addrs,
# MIT OR BSD-3-Clause) and keys from the system's random source (getrandom,
# MIT OR Apache-2.0). tokio and futures-util are already in the tree through
# Tauri.
tokio = { version = "1", features = ["net", "sync", "time", "io-util", "macros", "rt"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
chacha20poly1305 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
if-addrs = "0.15"
getrandom = "0.2"
base64 = "0.22"
# The remote's shared clipboard (src/remote/clip.rs): pictures go between the
# phone and the PC as PNG (png, MIT OR Apache-2.0, already in the graph).
png = "0.18"

# Print (src/print.rs): PDFKit prints the PDF itself in the system's print
# sheet. The same objc2 family Tauri already links (MIT OR Apache-2.0 OR Zlib).
#
# Cloud drives (src/cloud.rs): a signed-in drive's refresh token is kept in the
# system's credential store — the keychain here, Credential Manager on
# Windows, the Secret Service on Linux (which needs libdbus to build) — never
# in a file (keyring, MIT OR Apache-2.0). Without a backend feature keyring
# would keep it in memory only, so each platform names its own.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The on-device model runs on the GPU through Metal on a Mac; on Windows it
# runs on the CPU (AVX2 where the machine has it, chosen by ggml at run time).
llama-cpp-2 = { version = "0.1.157", default-features = false, features = ["metal", "mtmd"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSGeometry", "NSString", "NSURL", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSPasteboard", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-pdf-kit = { version = "0.3", default-features = false, features = ["std", "PDFDocument", "objc2-app-kit"] }
keyring = { version = "3.6", features = ["apple-native"] }
enigo = "0.6"
# The phone remote's shared clipboard, text and pictures (src/remote/clip.rs;
# arboard, MIT OR Apache-2.0).
arboard = "3.6"
# Ask ZOOD's ear and eyes (src/ask/): the microphone while its shortcut is
# held (cpal, Apache-2.0) and a picture of the screen when the person asks
# about it (xcap, Apache-2.0). Mac and Windows only.
cpal = "0.18"
xcap = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
# The phone remote's PC control (src/remote/input.rs): the pointer, keys and
# media keys, as the system's own input events (enigo, MIT). Mac and Windows
# only.
enigo = "0.6"
arboard = "3.6"
cpal = "0.18"
xcap = "0.9"
# The quick tools' Explorer menu (src/shell_menu.rs) is written to the
# person's own registry classes; Share › Email hands the file to the default
# mail program through Simple MAPI (src/share.rs); the Store copy asks
# whether it runs as a package (src/packaged.rs).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authentication_Identity", "Win32_Storage_Packaging_Appx", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Mapi", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
# Ask ZOOD reads the buttons of the window in front through UI Automation
# (src/ask/reach.rs), as screen readers do. Already in the tree through
# tauri and xcap; MIT OR Apache-2.0. The Store copy turns its start at
# sign-in on and off through the package's startup task (src/packaged.rs).
# Dropped shortcuts are read by the Shell's own IShellLinkW (src/lnk.rs).
windows = { version = "0.61", features = ["ApplicationModel", "Foundation", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Shell"] }
# Read aloud's natural voices (src/neural/): Piper voices and libtashkeel's
# diacritizer, both ONNX, run by ONNX Runtime through ort (MIT OR
# Apache-2.0; ONNX Runtime itself MIT), linked statically from the build
# ort downloads at compile time. No runtime download of the engine.
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-22"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
# Parses the menu bar's accelerators in a test exactly as Tauri does (it drops
# one it cannot read without a word). Already in the tree through tauri; MIT
# OR Apache-2.0.
muda = { version = "0.19", default-features = false }

# A test that prints through PDFKit into a file: AppKit wants the main thread,
# which only a test without the harness runs on.
[[test]]
name = "print"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
# Panics unwind, so the core and AI threads can catch one bad job and answer
# it with an error instead of closing the app. Unwinding through PDFium's FFI
# boundary is still safe: since Rust 1.81 a panic leaving an `extern "C"`
# frame aborts on its own rather than being undefined behaviour.
panic = "unwind"
strip = true

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
# Files dragged off ZOOD's shelf into Explorer, Finder, an email or a chat
# (src/shelf.rs): the system's own drag of files out of a window
# (CrabNebula's drag, Apache-2.0 OR MIT; what tauri-plugin-drag uses).
drag = "2.1"
