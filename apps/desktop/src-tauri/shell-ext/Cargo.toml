[package]
name = "zood-shell-ext"
version = "0.1.0"
description = "The quick tools in File Explorer's right-click menu for the Microsoft Store copy of ZOOD PDF"
authors = ["Warraq contributors"]
edition = "2021"
license = "Apache-2.0"
publish = false

# Its own cargo root, like the desktop crate beside it: the Store package
# carries this DLL next to warraq-desktop.exe (windows/store/AppxManifest.xml).
[workspace]

[lib]
name = "zood_shell_ext"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The menu the app wrote (src/shell_menu.rs, `packaged_menu`). MIT OR Apache-2.0.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Explorer's packaged menu entries are COM objects (IExplorerCommand) that
# Explorer loads through the package's COM surrogate. windows-rs, MIT OR
# Apache-2.0, the same family the desktop crate already uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }
windows-core = "0.61"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
# Nothing may unwind into Explorer: a panic in the DLL ends the surrogate, not Explorer.
panic = "abort"
