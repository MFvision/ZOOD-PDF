<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- ZOOD PDF app mark (original artwork, Apache-2.0): a blue gradient tile, a folded page and the Arabic letter zay (ز). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AA9FF"/>
      <stop offset="0.55" stop-color="#1F74F0"/>
      <stop offset="1" stop-color="#0B4FC4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A83F7"/>
      <stop offset="1" stop-color="#0B4FC4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#062A6B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#tile)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#gloss)"/>
  <g filter="url(#shadow)">
    <path d="M300 214 H606 L744 352 V770 Q744 810 704 810 H300 Q260 810 260 770 V254 Q260 214 300 214 Z" fill="#FFFFFF"/>
    <path d="M606 214 V312 Q606 352 646 352 H744 Z" fill="#CFE3FF"/>
  </g>
  <!-- zay: a tapered calligraphic stroke sweeping down to the left, with a diamond nuqta above -->
  <path d="M585 330 L630 375 L585 420 L540 375 Z" fill="url(#ink)"/>
  <path d="M540 468 Q590 440 618 482 C662 596 622 706 526 752 C452 788 376 790 304 772 C372 756 446 732 498 690 C556 640 566 566 540 468 Z" fill="url(#ink)"/>
</svg>
