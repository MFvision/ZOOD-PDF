@page{size:A4;margin:15mm} body{direction:rtl;text-align:right;line-height:1.9;font-size:14pt;margin:0} h1{font-size:22pt} p{margin:0 0 8pt} table{border-collapse:collapse;width:100%} td,th{border:1px solid #444;padding:4pt 8pt} .ltr{direction:ltr;text-align:left} body{font-family:'Amiri',serif} body{font-size:20pt;line-height:2.4}</style></head><body><p>الْعِلْمُ نُورٌ وَالْجَهْلُ ظَلَامٌ</p><p>قَرَأَ عَبْدُ اللهِ الْكِتَابَ الْجَدِيدَ فِي الْمَكْتَبَةِ</p><p>مرحباً بكم في محرّر وراق</p><p>لا لأ لإ لآ — أشكال اللام ألف</p><p>الـعـربـيـة الـمـمـدودة بالكشيدة</p><p>شَدَّةٌ وَفَتْحَتَانِ وَتَنْوِينٌ: كِتَابًا، كِتَابٌ، كِتَابٍ</p></body></html>
