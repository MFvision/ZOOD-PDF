<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:'Noto Naskh Arabic';src:url('../../../fonts/static/NotoNaskhArabic-Regular-static.ttf')}
@font-face{font-family:'Noto Sans Arabic';src:url('../../../fonts/static/NotoSansArabic-Regular-static.ttf')}
@font-face{font-family:'Amiri';src:url('../../../fonts/Amiri-Regular.ttf')}
@font-face{font-family:'Cairo';src:url('../../../fonts/static/Cairo-Regular-static.ttf')}
@font-face{font-family:'Inter';src:url('../../../fonts/static/Inter-Regular-static.ttf')}
@page { size: A4; margin: 0 }
html, body { margin: 0 }
body { padding: 15mm; font-family: 'Noto Naskh Arabic', 'Inter', sans-serif; font-size: 12pt; line-height: 2.1 }
h1 { font-size: 18pt; margin: 0 0 10pt }
table { border-collapse: collapse; width: 100% }
td, th { border: 0.75pt solid #333; padding: 3pt 6pt; height: 24pt; font-weight: normal; text-align: start }
.box { display: inline-block; border: 0.75pt solid #333; vertical-align: middle }
.check { display: inline-block; width: 11pt; height: 11pt; border: 0.75pt solid #333; vertical-align: middle; margin: 0 4pt }
.line { border-bottom: 0.75pt solid #333; height: 26pt }

</style></head><body><h1>طلب فتح حساب</h1>
<table>
<tr><th style="width:28%">الاسم الرباعي</th><td colspan="3" data-field="الاسم الرباعي" data-type="text"></td></tr>
<tr><th>رقم الهوية</th><td data-field="رقم الهوية" data-type="text"></td><th style="width:18%">الجنسية</th><td data-field="الجنسية" data-type="text"></td></tr>
<tr><th>المدينة</th><td data-field="المدينة" data-type="text"></td><th>الحي</th><td data-field="الحي" data-type="text"></td></tr>
<tr><th>تاريخ الميلاد</th><td colspan="3" data-field="تاريخ الميلاد" data-type="date"></td></tr>
<tr><th>البريد الإلكتروني</th><td colspan="3" data-field="البريد الإلكتروني" data-type="text"></td></tr>
</table>
<p>نوع الحساب: جاري <span data-field="نوع الحساب/جاري" data-type="checkbox">☐</span> توفير <span data-field="نوع الحساب/توفير" data-type="checkbox">☐</span></p>
<p>أقر بصحة البيانات أعلاه وأتحمل مسؤوليتها.</p>
<p>التوقيع: <span data-field="التوقيع" data-type="signature">________________</span>&nbsp;&nbsp;&nbsp;التاريخ: <span data-field="التاريخ" data-type="date">____/____/______</span></p></body></html>
