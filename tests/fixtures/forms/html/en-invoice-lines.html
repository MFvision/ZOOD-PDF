<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><style>
@font-face{font-family:'Noto Naskh Arabic';src:url('../../../fonts/static/NotoNaskhArabic-Regular-static.ttf')}
@font-face{font-family:'Noto Sans Arabic';src:url('../../../fonts/static/NotoSansArabic-Regular-static.ttf')}
@font-face{font-family:'Amiri';src:url('../../../fonts/Amiri-Regular.ttf')}
@font-face{font-family:'Cairo';src:url('../../../fonts/static/Cairo-Regular-static.ttf')}
@font-face{font-family:'Inter';src:url('../../../fonts/static/Inter-Regular-static.ttf')}
@page { size: A4; margin: 0 }
html, body { margin: 0 }
body { padding: 15mm; font-family: 'Inter', 'Inter', sans-serif; font-size: 12pt; line-height: 2.1 }
h1 { font-size: 18pt; margin: 0 0 10pt }
table { border-collapse: collapse; width: 100% }
td, th { border: 0.75pt solid #333; padding: 3pt 6pt; height: 24pt; font-weight: normal; text-align: start }
.box { display: inline-block; border: 0.75pt solid #333; vertical-align: middle }
.check { display: inline-block; width: 11pt; height: 11pt; border: 0.75pt solid #333; vertical-align: middle; margin: 0 4pt }
.line { border-bottom: 0.75pt solid #333; height: 26pt }

</style></head><body><h1>Purchase order</h1>
<p>Supplier <span data-field="Supplier" data-type="text">______________________________</span></p>
<table>
<tr><th>Item</th><th style="width:15%">Qty</th><th style="width:20%">Unit price</th></tr>
<tr><td data-field="Item 1" data-type="text"></td><td data-field="Qty 1" data-type="text"></td><td data-field="Unit price 1" data-type="text"></td></tr>
<tr><td data-field="Item 2" data-type="text"></td><td data-field="Qty 2" data-type="text"></td><td data-field="Unit price 2" data-type="text"></td></tr>
</table>
<p>Notes: <span data-field="Notes" data-type="text">.......................................................</span></p>
<p>Sign here <span data-field="Sign here" data-type="signature">____________________</span> Date <span data-field="Date" data-type="date">______________</span></p></body></html>
