<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:'Noto Naskh Arabic';src:url('../../../fonts/static/NotoNaskhArabic-Regular-static.ttf')}
@font-face{font-family:'Noto Sans Arabic';src:url('../../../fonts/static/NotoSansArabic-Regular-static.ttf')}
@font-face{font-family:'Amiri';src:url('../../../fonts/Amiri-Regular.ttf')}
@font-face{font-family:'Cairo';src:url('../../../fonts/static/Cairo-Regular-static.ttf')}
@font-face{font-family:'Inter';src:url('../../../fonts/static/Inter-Regular-static.ttf')}
@page { size: A4; margin: 0 }
html, body { margin: 0 }
body { padding: 15mm; font-family: 'Noto Naskh Arabic', 'Inter', sans-serif; font-size: 12pt; line-height: 2.1 }
h1 { font-size: 18pt; margin: 0 0 10pt }
table { border-collapse: collapse; width: 100% }
td, th { border: 0.75pt solid #333; padding: 3pt 6pt; height: 24pt; font-weight: normal; text-align: start }
.box { display: inline-block; border: 0.75pt solid #333; vertical-align: middle }
.check { display: inline-block; width: 11pt; height: 11pt; border: 0.75pt solid #333; vertical-align: middle; margin: 0 4pt }
.line { border-bottom: 0.75pt solid #333; height: 26pt }
body { font-family: 'Amiri', serif; font-size: 13pt }
</style></head><body><h1>بطاقة بيانات مراجع</h1>
<div style="display:grid; grid-template-columns: 1fr 1fr; column-gap: 24pt">
<p>الاسم <span data-field="الاسم" data-type="text">______________________</span></p>
<p>رقم الملف <span data-field="رقم الملف" data-type="text">________________</span></p>
<p>رقم الجواز <span data-field="رقم الجواز" data-type="text">...................................</span></p>
<p>تاريخ الإصدار <span data-field="تاريخ الإصدار" data-type="date">___/___/____</span></p>
</div>
<p>العنوان الوطني</p>
<div style="background:#e8e8e8; height:22pt; width:100%" data-field="العنوان الوطني" data-type="text"></div>
<p>اسم المرافق <span style="display:inline-block; width:200pt; border-bottom:1.5pt dotted #333" data-field="اسم المرافق" data-type="text">&nbsp;</span></p></body></html>
